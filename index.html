<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0b1422" />
        <title>Moonshot Frisbee Games</title>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div id="boot-loader" data-state="loading" aria-live="polite" aria-label="游戏资源加载中">
            <div class="boot-card">
                <div class="boot-brand"><span>FF-01</span><b>MOONSHOT</b></div>
                <p id="boot-label">正在准备校园资源…</p>
                <div id="boot-progress" role="progressbar" aria-label="资源加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <i id="boot-progress-fill"></i>
                </div>
                <small id="boot-percent">正在连接资源</small>
                <button id="boot-continue" type="button" hidden>进入游戏 <span>点击后进入首页并开启音频</span></button>
            </div>
        </div>
        <style>
            #boot-loader{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#0b1422;color:#eef2f4;transition:opacity .35s ease,visibility .35s ease}
            #boot-loader::before{position:absolute;inset:0;content:"";opacity:.16;background:linear-gradient(90deg,transparent 49.8%,#8293a2 50%,transparent 50.2%),linear-gradient(transparent 49.8%,#8293a2 50%,transparent 50.2%);background-size:68px 68px;mask-image:radial-gradient(ellipse,#000,transparent 72%)}
            #boot-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
            .boot-card{position:relative;width:min(360px,calc(100vw - 48px));padding:28px 30px;background:rgb(16 26 38 / .94);border:1px solid rgb(238 242 244 / .16);box-shadow:0 24px 90px #0008}
            .boot-brand{display:flex;align-items:center;gap:10px;letter-spacing:.16em;font:700 14px/1.2 system-ui,sans-serif}
            .boot-brand span{padding:5px 7px;background:#ffc21a;color:#0b1422;letter-spacing:.04em}
            .boot-brand b{font-size:17px}
            #boot-label{margin:26px 0 12px;color:#dbe3e8;font:500 13px/1.5 system-ui,sans-serif;letter-spacing:.04em}
            #boot-progress{position:relative;height:5px;overflow:hidden;background:#293746}
            #boot-progress-fill{position:absolute;inset:0 auto 0 0;width:15%;background:linear-gradient(90deg,#ffc21a,#ffe28a);box-shadow:0 0 14px #ffc21a88;transition:width .32s ease}
            #boot-loader:not([data-determinate="true"]) #boot-progress-fill{animation:boot-sweep 1.35s cubic-bezier(.4,0,.2,1) infinite}
            #boot-percent{display:block;margin-top:10px;color:#8999a7;font:11px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-align:right}
            #boot-continue{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin-top:24px;padding:14px 16px;border:0;background:#ffc21a;color:#101a26;font:700 16px/1.2 system-ui,sans-serif;cursor:pointer;transition:background .18s ease,transform .18s ease}
            #boot-continue:hover{background:#ffda62;transform:translateY(-1px)}
            #boot-continue:focus-visible{outline:3px solid #eef2f4;outline-offset:3px}
            #boot-continue span{font:500 11px/1.4 system-ui,sans-serif;opacity:.72}
            #boot-continue[hidden]{display:none}
            @keyframes boot-sweep{0%{transform:translateX(-115%);width:30%}55%{transform:translateX(150%);width:42%}100%{transform:translateX(350%);width:30%}}
            @media(prefers-reduced-motion:reduce){#boot-loader,#boot-progress-fill,#boot-continue{transition:none}#boot-loader:not([data-determinate="true"]) #boot-progress-fill{animation:none;width:42%}}
        </style>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
