<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/favicon.png" />
        <link rel="preload" as="image" href="/assets/ui/moonshot-loading.png" fetchpriority="high" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0b1422" />
        <title>Moonshot Frisbee Games</title>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div id="boot-loader" data-state="loading" aria-live="polite" aria-label="游戏资源加载中">
            <div class="boot-card">
                <div class="boot-info">
                    <div class="boot-brand"><span>FF-01</span><b>游戏引擎启动</b></div>
                    <p id="boot-label">正在准备校园资源…</p>
                </div>
                <div class="boot-actions">
                    <small id="boot-percent">正在连接资源</small>
                    <button id="boot-continue" type="button" hidden>进入游戏 <span>点击后进入首页并开启音频</span></button>
                </div>
                <div id="boot-progress" role="progressbar" aria-label="资源加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <i id="boot-progress-fill"></i>
                </div>
            </div>
        </div>
        <style>
            #boot-loader{position:fixed;inset:0;z-index:10000;display:grid;align-items:end;background:#06152d url('/assets/ui/moonshot-loading.png') center 47%/cover no-repeat;color:#f4f9ff;transition:opacity .35s ease,visibility .35s ease}
            #boot-loader::before{position:absolute;inset:0;content:"";background:linear-gradient(180deg,rgba(3,11,29,.02) 46%,rgba(3,12,31,.1) 68%,rgba(2,9,24,.62) 100%),linear-gradient(90deg,rgba(2,10,28,.1),transparent 28%,transparent 72%,rgba(2,10,28,.1))}
            #boot-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
            .boot-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 28px;width:100%;padding:12px clamp(20px,5vw,76px) max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(3,14,36,.26),rgba(2,9,24,.78));border-top:1px solid rgba(41,145,255,.3);box-shadow:0 -12px 40px rgba(0,14,48,.16);backdrop-filter:blur(3px)}
            .boot-info{display:flex;align-items:center;gap:16px;min-width:0}
            .boot-brand{display:flex;align-items:center;gap:10px;letter-spacing:.12em;font:700 12px/1.2 system-ui,sans-serif;color:#dcecff}
            .boot-brand span{padding:5px 7px;border:1px solid rgba(27,130,255,.75);background:rgba(0,73,174,.35);color:#68b7ff;letter-spacing:.05em}
            .boot-brand b{font-size:13px}
            #boot-label{min-width:0;margin:0;color:#f2f7ff;font:500 13px/1.5 system-ui,sans-serif;letter-spacing:.03em;text-shadow:0 1px 12px #001;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .boot-actions{display:flex;align-items:center;justify-content:flex-end;gap:20px;min-width:0}
            #boot-progress{position:relative;grid-column:1/-1;height:6px;overflow:hidden;background:rgba(4,27,65,.94);border:1px solid rgba(41,134,255,.36);box-shadow:inset 0 1px 4px rgba(0,0,0,.55)}
            #boot-progress-fill{position:absolute;inset:0 auto 0 0;width:15%;background:linear-gradient(90deg,#0754e8,#147bff 72%,#29b6ff);box-shadow:0 0 9px #075cff,0 0 20px rgba(0,113,255,.8);transition:width .32s ease}
            #boot-loader:not([data-determinate="true"]) #boot-progress-fill{animation:boot-sweep 1.35s cubic-bezier(.4,0,.2,1) infinite}
            #boot-percent{display:block;color:#b9d8ff;font:12px/1.4 system-ui,sans-serif;letter-spacing:.05em;text-align:right;white-space:nowrap}
            #boot-continue{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:42px;padding:10px 14px;border:1px solid #278aff;background:linear-gradient(110deg,#0752db,#087cff);box-shadow:0 0 18px rgba(0,105,255,.3);color:#fff;font:700 15px/1.2 system-ui,sans-serif;cursor:pointer;transition:background .18s ease,box-shadow .18s ease,transform .18s ease}
            #boot-continue:hover{background:linear-gradient(110deg,#1268ff,#1095ff);box-shadow:0 0 24px rgba(0,128,255,.62);transform:translateY(-1px)}
            #boot-continue:focus-visible{outline:3px solid #74c6ff;outline-offset:3px}
            #boot-continue span{font:500 11px/1.4 system-ui,sans-serif;color:#deedff}
            #boot-continue[hidden]{display:none}
            @keyframes boot-sweep{0%{transform:translateX(-115%);width:30%}55%{transform:translateX(150%);width:42%}100%{transform:translateX(350%);width:30%}}
            @media(max-width:640px){.boot-card{grid-template-columns:1fr;gap:12px;padding:14px 18px max(14px,env(safe-area-inset-bottom))}.boot-info{align-items:flex-start;flex-direction:column;gap:8px}.boot-actions{justify-content:space-between;gap:12px}#boot-continue{min-height:42px;padding:10px 12px}#boot-continue span{max-width:150px;text-align:right}}
            @media(max-width:380px){#boot-continue span{display:none}}
            @media(prefers-reduced-motion:reduce){#boot-loader,#boot-progress-fill,#boot-continue{transition:none}#boot-loader:not([data-determinate="true"]) #boot-progress-fill{animation:none;width:42%}}
        </style>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
